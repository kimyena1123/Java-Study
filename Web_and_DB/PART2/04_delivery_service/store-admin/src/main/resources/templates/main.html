<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주문 관리</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .button-container button {
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div id="app">
    <table>
        <thead>
        <tr>
            <th>주문번호</th>
            <th>주문내용</th>
            <th>상태</th>
            <th>액션</th>
        </tr>
        </thead>
        <tbody>
        <!-- 주문이 중복될 수 있으므로 index까지 조합하여 key 설정 -->
        <tr v-for="(order, index) in orders" :key="order.user_order_response.id + '-' + index">
            <td>{{ order.user_order_response.id }}</td>
            <td>
                <ul>
                    <li v-for="item in order.store_menu_responses" :key="item.id">
                        {{ item.name }} {{ item.amount }}
                    </li>
                </ul>
            </td>
            <td>{{ order.user_order_response.status }}</td>
            <td class="button-container">
                <button @click="acceptOrder(order)">주문수락</button>
                <button @click="startCooking(order)">조리시작</button>
                <button @click="startDelivery(order)">배달시작</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    new Vue({
        el: "#app",
        data: {
            orders: [] // SSE로 받아온 주문 데이터
        },
        methods: {
            acceptOrder(order) {
                console.log("주문수락:", order);
                // 실제 주문 처리 API 호출 가능
            },
            startCooking(order) {
                console.log("조리시작:", order);
            },
            startDelivery(order) {
                console.log("배달시작:", order);
            },
            pushData(order) {
                // 그냥 추가 (중복 허용)
                this.orders.unshift(order);
            }
        },
        mounted() {
            const url = "http://localhost:8081/api/sse/connect";
            const eventSource = new EventSource(url);

            eventSource.onopen = () => {
                console.log("✅ SSE 연결 완료");
            };

            eventSource.onmessage = event => {
                console.log("📨 새 주문 수신:", event.data);
                try {
                    const data = JSON.parse(event.data);
                    this.pushData(data);
                } catch (e) {
                    console.error("❌ JSON 파싱 오류:", e);
                }
            };

            eventSource.onerror = err => {
                console.error("🚫 SSE 오류:", err);
            };
        }
    });
</script>
</body>
</html>
